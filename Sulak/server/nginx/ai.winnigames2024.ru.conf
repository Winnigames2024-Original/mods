server {
    listen 80;
    listen [::]:80;
    server_name ai.winnigames2024.ru;

    root /var/www/ai;
    index index.php index.html;

    access_log /var/log/nginx/ai.access.log;
    error_log  /var/log/nginx/ai.error.log;

    client_max_body_size 2m;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-FPMVERSION-fpm.sock;
        fastcgi_read_timeout 180;
    }

    location ~ /\. {
        deny all;
    }

    # база и конфиг наружу не отдаём
    location ~* /(config\.php|lib\.php)$ {
        deny all;
    }
}
