plugins { id 'com.android.application' }

android {
    namespace 'com.winnigames2024.geodash'
    compileSdk 34

    defaultConfig {
        // данные игры: /Android/data/com.winnigames2024.geodash/files/assets/
        applicationId "com.winnigames2024.geodash"
        minSdk 21
        targetSdk 34
        versionCode 31
        versionName "2.2.5"
    }

    // свой постоянный ключ в репозитории: подпись одинаковая у всех сборок,
    // иначе телефон не даст поставить обновление поверх старой версии
    signingConfigs {
        geodash {
            storeFile rootProject.file('geodash.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.geodash
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false }

    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
