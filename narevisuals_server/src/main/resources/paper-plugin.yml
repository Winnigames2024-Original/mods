name: NareServer
version: '$version'
main: com.winnigames2024.nareserver.NareServer
api-version: '1.21'
load: POSTWORLD
description: Серверная половина NareVisuals — значок мода, честная дальность, метки сломанных блоков
authors:
  - Winnigames2024

permissions:
  narevisuals.reach:
    description: Разрешить расширенную дальность ломания и удара
    default: op
  narevisuals.area:
    description: Разрешить ломание области (3x3 и больше)
    default: op
  narevisuals.restore:
    description: Разрешить возвращать на место сломанные блоки
    default: op
  narevisuals.tp:
    description: Разрешить телепорт к игрокам с модом
    default: op
