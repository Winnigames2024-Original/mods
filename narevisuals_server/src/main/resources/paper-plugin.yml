name: NareServer
version: '$version'
main: com.winnigames2024.nareserver.NareServer
api-version: '1.21'
load: POSTWORLD
description: Серверная половина NareVisuals — значок мода, честная дальность, метки сломанных блоков
authors:
  - Winnigames2024

commands:
  nare:
    description: Плитки паркура — выдать и посмотреть, сколько стоит
    usage: /nare give checkpoint|uncheckpoint|jumppad [сила] [ник]
    permission: narevisuals.parkour

permissions:
  narevisuals.reach:
    description: Разрешить расширенную дальность ломания и удара
    default: op
  narevisuals.voice:
    description: Разрешить голосовой чат
    default: true
  narevisuals.bypass:
    description: Пускать на сервер без мода, когда require-mod включён
    default: op
  narevisuals.parkour:
    description: Выдавать и настраивать плитки паркура
    default: op
