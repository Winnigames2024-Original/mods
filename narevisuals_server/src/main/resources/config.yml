# Дальность действий для игроков с модом и правом narevisuals.reach.
# 0 — не трогать, пусть будет обычная.
reach:
  blocks: 0
  entities: 0

# Рассылать всем с модом координаты сломанных блоков.
marks: true

# Разрешить пересылку «шуток». Дойдут только до тех, кто сам их включил
# аргументом запуска --funtrolls2026.
trolls: true
