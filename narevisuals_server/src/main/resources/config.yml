# Дальность действий для игроков с модом и правом narevisuals.reach.
# 0 — не трогать, пусть будет обычная.
reach:
  blocks: 0
  entities: 0

# Рассылать всем с модом координаты сломанных блоков.
marks: true

# Разрешить пересылку «шуток». Дойдут только до тех, кто сам их включил
# аргументом запуска --funtrolls2026.
trolls: true

# Голосовой чат мода. Звук идёт по обычной связи с игрой, отдельный порт
# открывать не нужно. distance — за сколько блоков ещё слышно. Нужно право
# narevisuals.voice, у операторов оно уже есть.
voice:
  enabled: true
  distance: 48
