# Что мод может делать на этом сервере. Запрещённое мод выключает у себя
# сам: сохранённые настройки игрока при этом не стираются, он просто не
# может ими воспользоваться, пока тут. Вышел на сервер без плагина — играет
# как хочет, ограничивать его там нам нечем и незачем.
#
# freecam-distance — на сколько блоков свободная камера может улететь от
# самого игрока. 0 — без предела.
limits:
  freecam: true
  freecam-distance: 0
  esp-players: true
  esp-mobs: true
  bright: true
  zoom: true

# Пускать на сервер только тех, у кого стоит мод. Проверяем так: у игрока с
# модом клиент здоровается с плагином сам в первые секунды. Не поздоровался —
# значит мода нет, и мы его отправляем с сообщением.
#
# seconds — сколько ждать здоровья. На плохой связи вход бывает долгим,
# меньше 10 ставить не стоит. message — что человек увидит.
require-mod:
  enabled: false
  seconds: 20
  message: |-
    Сюда пускают только с модом NareVisuals.
    Поставьте лаунчер: winnigames2024-original.github.io/NareLauncher

# Защита от взрывов, которые кладут и клиент, и сервер.
#
# max-nearby — сколько зажжённой ТНТ может быть рядом. Когда её больше,
# новая просто не зажигается: блок остаётся лежать, игрок видит, что «не
# поджигается», и это куда лучше, чем десять секунд тишины у всех.
# radius — в каком радиусе считаем.
#
# rescue — уводить ли игрока на спавн, когда его клиент уже не тянет. Мод
# сам просит о помощи, когда рядом много взрывчатки и кадры встали.
# rescue-command — чем уводим; пусто — телепорт на точку спавна мира.
tnt:
  max-nearby: 24
  radius: 8
  rescue: true
  rescue-command: "spawn"

# Дальность действий для игроков с модом и правом narevisuals.reach.
# 0 — не трогать, пусть будет обычная.
reach:
  blocks: 0
  entities: 0

# Рассылать всем с модом координаты сломанных блоков.
marks: true

# Разрешить пересылку «шуток». Дойдут только до тех, кто сам их включил
# аргументом запуска --funtrolls2026.
trolls: true

# Голосовой чат мода. Звук идёт по обычной связи с игрой, отдельный порт
# открывать не нужно. Нужно право narevisuals.voice, у операторов оно есть.
#
# distance — за сколько блоков ещё слышно. 0 — слышно везде и в любом мире,
# как общий чат; расстояние тогда не считается вовсе. Это решает сервер,
# игрок у себя может только убавить, но не увеличить.
#
# Учтите: при 0 каждое слово уходит всем сразу. Один говорящий — это
# примерно 8 КБ/с на каждого слушателя, так что на людном сервере исходящий
# трафик растёт быстро.
# port — отдельный UDP-порт для звука. 0 — не открывать, тогда голос идёт
# по обычному соединению с игрой и настраивать нечего. Отдельный порт лучше
# на плохой связи: игровое соединение это TCP, и потерянный пакет задерживает
# всё, что едет следом. На UDP потерянный кусочек звука просто пропадает.
#
# Порт должен быть открыт на UDP в файрволе и проброшен до сервера. Если он
# не откроется или у игрока не пройдёт, голос сам вернётся на старый путь.
# bind — адрес, на котором слушать; пусто означает «на всех».
voice:
  enabled: true
  distance: 48
  port: 0
  bind: ""
