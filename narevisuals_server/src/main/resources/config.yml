# Дальность действий для игроков с модом и правом narevisuals.reach.
# 0 — не трогать, пусть будет обычная.
reach:
  blocks: 0
  entities: 0

# Ломание области (3x3 и больше) по-настоящему, а не только на экране.
# Блоки ломаются как обычным ударом игрока: защиты регионов работают,
# дроп падает по обычным правилам. Нужно право narevisuals.area.
area:
  enabled: true
  max: 128

# Вернуть на место то, что сломал. Ставим только туда, где сейчас пусто,
# чтобы не затереть чужую постройку. Нужно право narevisuals.restore.
restore:
  enabled: true
  max: 512

# Телепорт к игрокам, у которых тоже стоит мод. Нужно право narevisuals.tp.
teleport: true

# Рассылать всем с модом координаты сломанных блоков.
marks: true

# Разрешить пересылку «шуток». Дойдут только до тех, кто сам их включил
# аргументом запуска --funtrolls2026.
trolls: true
