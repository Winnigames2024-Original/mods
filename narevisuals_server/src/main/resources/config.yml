# Дальность действий для игроков с модом и правом narevisuals.reach.
# 0 — не трогать, пусть будет обычная.
reach:
  blocks: 0
  entities: 0

# Рассылать всем с модом координаты сломанных блоков.
marks: true

# Разрешить пересылку «шуток». Дойдут только до тех, кто сам их включил
# аргументом запуска --funtrolls2026.
trolls: true

# Голосовой чат мода. Звук идёт по обычной связи с игрой, отдельный порт
# открывать не нужно. Нужно право narevisuals.voice, у операторов оно есть.
#
# distance — за сколько блоков ещё слышно. 0 — слышно везде и в любом мире,
# как общий чат; расстояние тогда не считается вовсе. Это решает сервер,
# игрок у себя может только убавить, но не увеличить.
#
# Учтите: при 0 каждое слово уходит всем сразу. Один говорящий — это
# примерно 8 КБ/с на каждого слушателя, так что на людном сервере исходящий
# трафик растёт быстро.
# port — отдельный UDP-порт для звука. 0 — не открывать, тогда голос идёт
# по обычному соединению с игрой и настраивать нечего. Отдельный порт лучше
# на плохой связи: игровое соединение это TCP, и потерянный пакет задерживает
# всё, что едет следом. На UDP потерянный кусочек звука просто пропадает.
#
# Порт должен быть открыт на UDP в файрволе и проброшен до сервера. Если он
# не откроется или у игрока не пройдёт, голос сам вернётся на старый путь.
# bind — адрес, на котором слушать; пусто означает «на всех».
voice:
  enabled: true
  distance: 48
  port: 0
  bind: ""
