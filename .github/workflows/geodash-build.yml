name: GEO DASH — сборка exe и apk

on:
  push:
    paths:
      - 'GEO DASH/client/**'
      - 'GEO DASH/android/**'
      - '.github/workflows/geodash-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geodash-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - uses: actions/checkout@v4

      - name: .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Сборка GEO_DASH.exe (один файл, win-x64)
        run: |
          cd "GEO DASH/client"
          dotnet publish "GEO DASH.csproj" -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -p:EnableWindowsTargeting=true \
            -o "$GITHUB_WORKSPACE/out-win"
          ls -la "$GITHUB_WORKSPACE/out-win"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Сборка GEO_DASH.apk
        run: |
          cd "GEO DASH/android"
          gradle --no-daemon assembleRelease
          find . -name "*.apk"

      - name: Кладу сборки в download/
        run: |
          mkdir -p "GEO DASH/download"
          cp "$GITHUB_WORKSPACE/out-win/GEO DASH.exe" "GEO DASH/download/GEO_DASH.exe"
          cp "$(find 'GEO DASH/android' -name '*release*.apk' | head -1)" "GEO DASH/download/GEO_DASH.apk"
          ls -la "GEO DASH/download"

      - name: Коммит сборок
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "GEO DASH/download/GEO_DASH.exe" "GEO DASH/download/GEO_DASH.apk"
          if git diff --cached --quiet; then
            echo "сборки не изменились"
          else
            git commit -m "GEO DASH: новые сборки exe и apk [skip ci]"
            git push
          fi
